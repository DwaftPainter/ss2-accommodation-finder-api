name: Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check secrets
        run: |
          echo "DROPLET_HOST exists: ${{ secrets.DROPLET_HOST != '' }}"
          echo "DROPLET_USER exists: ${{ secrets.DROPLET_USER != '' }}"
          echo "DROPLET_SSH_KEY exists: ${{ secrets.DROPLET_SSH_KEY != '' }}"

      - name: Deploy to DigitalOcean Droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            cd /opt/accommodation-backend/ss2-accommodation-finder-api
            git pull origin main
            docker compose down
            docker compose up -d --build
            docker image prune -f
